<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

<body>
    
        <div class="tudo">
            <div class="titulo">
                <label>Qual gatinho você seria?</label>
            </div>
            <br><br>
            <center> 
                <div class="botao">
                    <button onclick="buscarGato()">Clique aqui para saber!</button>
                </div>
                <br><br>
                <div id="gato"></div>
            </center>
        </div>
    
</body>
<script>
    function buscarCEP01() {
        console.log("Teste 1: inicio");
        let retornoAPI = fetch(`https://viacep.com.br/ws/01001000/json/`)
            .then((retornoPronto) => {
                return retornoPronto.json()

            })
            .then((retornoProntoConvertido) => {
                console.log("Teste 2: retorno agora sim:", retornoProntoConvertido)

            })
        console.log("Teste 3: fim");
    }

    async function buscarGato() {
        gato.innerHTML = ""
        //console.log("Teste 1: inicio");
        let retornoAPI = await fetch(`https://api.thecatapi.com/v1/images/search`)
        let retornoProntoConvertido = await retornoAPI.json()

        //gatinhos.push(retornoProntoConvertido)

        console.log("Teste 2, retorno pronto", retornoProntoConvertido)

        for (let i = 0; i < retornoProntoConvertido.length; i++) {

            gato.innerHTML += `<img src="${retornoProntoConvertido[i].url}" alt="">`

        }
        //console.log("Teste 3: fim")

    }
</script>
