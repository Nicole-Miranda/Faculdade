<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="sorteio()">Sortear </button>
    <div id="resultado"></div>
</body>
<script>
    function sorteio(){
        let numero = Math.random();

        if(numero > 0.5){
            resultado.innerHTML = `${numero} <br>`
            resultado.innerHTML = 'Eu arredondaria para 1'
        }else{
            resultado.innerHTML = 'Eu arredondaria para 1'
        }

    }
</script>
</html>
