<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="Sortear()">Sortear time</button>
    <div id="mensagem"></div>
    
</body>
    <script>
        function Sortear() {
            let url = ``;

            let num = Math.random();

            min = 1
            max = 4

            let Resultado = parseInt((num * (max - min + 1)) + min);

            if(Resultado == 1) {
                console.log('Palmeiras');
                url = `https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQWR-4Gl-ZPmYC_EWrE1RPj_uoTkqeAi6skjw&s`;
            } else if (Resultado == 2) {
                console.log('Corinthians');
                url = `https://upload.wikimedia.org/wikipedia/pt/b/b4/Corinthians_simbolo.png`;
            } else if (Resultado == 3) {
                console.log('São Paulo');
                url = `https://upload.wikimedia.org/wikipedia/commons/thumb/6/6f/Brasao_do_Sao_Paulo_Futebol_Clube.svg/3840px-Brasao_do_Sao_Paulo_Futebol_Clube.svg.png`;
            } else if (Resultado == 4) {
                console.log('Santos');
                url = `https://upload.wikimedia.org/wikipedia/commons/1/15/Santos_Logo.png`;
            }

            mensagem.innerHTML = `<img style="width: 150px" src="${url}"/>`
        }
    </script>
</html>
