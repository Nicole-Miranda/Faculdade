<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="sorteio()">Sortear time</button>
    <div id="resultado"></div>
</body>
<script>
    function sorteio(){
            
        let numeros = Math.random()
        let max = 4
        let min = 1

        let time_aleatorios = parseInt((numeros * (max - min )) + min);

        if(time_aleatorios == 1){
            resultado.innerHTML = `SANTOS!`
        }else if (time_aleatorios == 2){
            resultado.innerHTML = 'CORINTHIAS!!'
        }else if(time_aleatorios == 3){
            resultado.innerHTML = 'PALMEIRAS !!'
        }else if(time_aleatorios == 4){
            resultado.innerHTML = 'SÃO PAULO!!'
        }
    }
</script>
</html>
