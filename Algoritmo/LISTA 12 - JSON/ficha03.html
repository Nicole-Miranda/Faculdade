<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objeto alinhado</title>
</head>
<body>
    <h1>Objeto Alinhado</h1>
   <button onclick="exibir">Exibir endereço</button> 
    <div id="resultado"></div>
</body>
<script>
    function exibir(){

        let cliente = {
            "Nome":"Bole",
            "Idade":19,
            "Endereco":{
                "Rua":"Dasilva",
                "Numero":123,
                "Cidade":"Ubatuba"
            }
        }
        
        let endereco = cliente.Endereco
        
        resultado.innerHTML += `${cliente.Nome} <br>
        ${cliente.Idade}<br>
        ${cliente.Endereco}<br>
        ${endereco.Rua}<br>
        ${endereco.Numero}<br>
        ${endereco.Cidade}.`
        
    }
</script>
</html>
