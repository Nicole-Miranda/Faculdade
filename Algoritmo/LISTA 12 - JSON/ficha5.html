<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Contatos</title>
</head>

<body>

    <button onclick="exibir">Exibir Lista</button>
    <br><br>
    <div id="resultado"></div>
</body>
<script>
    let listaContatos = []
    function exibir() {


        let contato1 = {
            "nome": "QualqueNome",
            "telefone": "9999999999",
        }

        let contato2 = {
            "nome": "Nicole",
            "telefone": "2222222222"
        }

        let contato3 = {
            "nome": "Miranda",
            "telefone": "3333333333"
        }

        let contato4 = {
            "nome": "Martins",
            "telefone": "4444444444"
        }

        listaContatos.push(contato1);
        listaContatos.push(contato2);
        listaContatos.push(contato3);
        listaContatos.push(contato4);

        for (let i = 0; i < listaContatos.length; i++) {
            resultado.innerHTML += `
            Nome:${listaContatos[i].nome}<br>
            telefone:${listaContatos[i].telefone}`
        }

    }
</script>

</html>
